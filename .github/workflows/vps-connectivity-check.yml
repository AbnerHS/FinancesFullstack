name: VPS Connectivity Check

# Diagnóstico somente leitura: testa se o runner do GitHub alcança a VPS por SSH com os mesmos
# secrets do deploy-backend.yml. Não altera nada no servidor.

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    environment:
      name: Production
    permissions:
      contents: read
    timeout-minutes: 5

    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USERNAME: ${{ secrets.VPS_USERNAME }}

    steps:
      - name: Runner public IP
        run: curl -s --max-time 10 https://api.ipify.org || true

      - name: TCP check
        run: |
          port="${VPS_PORT:-22}"
          if timeout 15 bash -c "cat < /dev/null > /dev/tcp/$VPS_HOST/$port"; then
            echo "TCP $port: conexão aberta"
          else
            echo "::error::TCP $port: sem resposta (timeout ou recusada)"
            exit 1
          fi

      - name: SSH check (read-only)
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh -i ~/.ssh/vps_key -p "${VPS_PORT:-22}" \
            -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            "$VPS_USERNAME@$VPS_HOST" \
            'hostname; uptime; df -h / | tail -1; docker ps --format "{{.Names}}\t{{.Status}}"'

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vps_key
